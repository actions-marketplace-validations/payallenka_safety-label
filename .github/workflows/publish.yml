name: publish
# Publishes to npm when a GitHub release is published, using npm trusted publishing (OIDC):
# no npm token is stored anywhere, and the package gets a provenance attestation.
# One-time setup on npmjs.com: package Settings -> Trusted publisher -> GitHub Actions,
# repository payallenka/safety-label, workflow publish.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "release tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
      - run: npm test
      - run: npm publish

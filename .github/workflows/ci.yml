name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Runs the action exactly as users do, against the committed fixtures.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline from the first build
        uses: ./
        with:
          path: test/fixtures/tracked-v1.apk
          report: v1.json
      - name: An update that adds a tracker must fail
        id: update
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/tracked-v2.apk
          baseline: v1.json
          report: v2.json
      - name: Check the outcome
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.update.outcome }}" = failure
          test "${{ steps.update.outputs.new-findings }}" = true
          test "${{ steps.update.outputs.trackers }}" = 3
